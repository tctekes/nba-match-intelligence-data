name: NBA Model C input formula parity probe

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/model_input_parity_probe.py"
      - "tests/test_model_input_parity_probe.py"
      - ".github/workflows/model-input-parity.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run numeric formula test cases
        run: python -B -m unittest discover -s tests -p test_model_input_parity_probe.py -v
      - name: Reconstruct real Model C inputs and compare published CSV
        run: python -B tools/model_input_parity_probe.py
      - name: Preserve evidence even if mismatch occurs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-model-input-parity-report
          path: model_input_parity_report.json
          retention-days: 7
          if-no-files-found: warn
