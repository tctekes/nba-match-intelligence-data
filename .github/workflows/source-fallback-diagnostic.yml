name: NBA multi-source schema and freshness diagnostic
on:
  push:
    branches: [main]
    paths:
      - "tools/task08/source_fallback_diagnostic.py"
      - "tools/task08/source_parity_diagnostic.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe source freshness and independent NBA Stats fields (read-only)
        run: |
          python -B tools/task08/source_fallback_diagnostic.py
          python -B tools/task08/source_parity_diagnostic.py
