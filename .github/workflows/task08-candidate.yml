name: NBA original Task08 suite and cloud snapshot candidate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-task08-candidate
  cancel-in-progress: false

jobs:
  task08:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all 9 original Task08 synthetic tests
        working-directory: tools/task08
        run: python -B -m unittest -v test_static_snapshot
      - name: Capture real source receipts and run full Task08 date gate
        run: python -B tools/task08/cloud_capture_candidate.py
      - name: Publish candidate ONLY if all gates pass
        run: |
          git config user.name "NBA Match Intelligence validation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/candidates published/task08_candidate_index.json
          if git diff --cached --quiet; then
            echo "No new candidate files"
          else
            git commit -m "Publish Task08-validated experimental candidate (NOT PRODUCTION)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Record publication safety rule
        if: always()
        run: |
          {
            echo "## NBA Task08 run"
            echo "- This workflow never creates published/latest_valid.json."
            echo "- Full ESPN per-game core box-field parity remains outstanding."
            echo "- The publicly copied math functions contain no model coefficients."
          } >> "$GITHUB_STEP_SUMMARY"
